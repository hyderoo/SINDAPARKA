name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, check-latest: true }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, check-latest: true }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: results/
          retention-days: 14
      # GitHub Pages only accepts deploys from the default branch;
      # skip publishing on PRs (e.g. Dependabot) instead of failing.
      - uses: actions/upload-pages-artifact@v5
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: results/html
      - uses: actions/deploy-pages@v5
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
